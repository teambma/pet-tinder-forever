# Render blueprint — one web service, one Postgres database.
# Deploy with: Render dashboard → New → Blueprint → point at this repo.
#
# Migrations run in the build command because `preDeployCommand` requires a
# paid instance type. On a paid plan, move `npm run db:migrate` out of
# buildCommand and into `preDeployCommand:` so it runs after the build but
# before the new version starts serving.
#
# See README.md → Deploying to Render.

databases:
  - name: pawspot-db
    databaseName: pawspot
    user: pawspot
    plan: basic-256mb

services:
  - type: web
    name: pawspot
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install && npm run build && npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pawspot-db
          property: connectionString
      # 32+ char random string, generated once by Render and then kept.
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # BETTER_AUTH_URL / APP_URL are deliberately not set: the server falls
      # back to RENDER_EXTERNAL_URL, which Render injects into every service.
      # Set them only for a custom domain. See README → Getting the URLs right.
